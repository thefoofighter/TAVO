name: Bug report
description: Badges are wrong, missing, or TAVO does something unexpected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: TAVO version
      description: From the tray menu ("TAVO x.y.z on GitHub") or `TAVO.exe --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Run `winver`.
      placeholder: "Windows 11 24H2, build 26100.1234"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the apps and versions you have pinned. Say whether you selected Refresh explorer.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Output of `TAVO.exe --plan`
      description: Run it in a terminal. Remove anything you do not want to share.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: From `%LOCALAPPDATA%\TAVO\tavo.log` (tray menu > Open log folder).
      render: text
